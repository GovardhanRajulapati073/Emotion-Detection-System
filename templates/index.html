<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Emotion Detection System</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#0f172a;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
      color:white;
    }

    .container{
      width:100%;
      max-width:1000px;
      background:#1e293b;
      padding:30px;
      border-radius:20px;
      box-shadow:0 0 30px rgba(0,0,0,0.4);
    }

    h1{
      text-align:center;
      margin-bottom:10px;
      font-size:2.5rem;
    }

    p{
      text-align:center;
      color:#cbd5e1;
      margin-bottom:25px;
    }

    .video-container{
      position:relative;
      width:100%;
      border-radius:20px;
      overflow:hidden;
      border:3px solid #38bdf8;
    }

    video{
      width:100%;
      display:block;
    }

    canvas{
      position:absolute;
      top:0;
      left:0;
    }

    .status{
      text-align:center;
      margin-top:20px;
      font-size:18px;
      color:#38bdf8;
    }

  </style>

</head>

<body>

<div class="container">

  <h1>Real Time Emotion Detection</h1>

  <p>AI Powered Browser Based Emotion Detection System</p>

  <div class="video-container">

    <video id="video" autoplay playsinline></video>

    <canvas id="canvas"></canvas>

  </div>

  <div class="status" id="status">
    Starting Camera...
  </div>

</div>

<script>

const video = document.getElementById("video");

const canvas = document.getElementById("canvas");

const ctx = canvas.getContext("2d");

const statusText = document.getElementById("status");

async function startCamera(){

    try{

        const stream = await navigator.mediaDevices.getUserMedia({
            video:true,
            audio:false
        });

        video.srcObject = stream;

        statusText.innerHTML = "Camera Connected";

    }

    catch(error){

        console.error(error);

        statusText.innerHTML = "Camera Permission Denied";

    }

}

startCamera();

video.addEventListener('play', () => {

    setInterval(async () => {

        canvas.width = video.videoWidth;

        canvas.height = video.videoHeight;

        ctx.drawImage(video,0,0);

        const image = canvas.toDataURL('image/jpeg');

        try{

            const response = await fetch('/predict',{

                method:'POST',

                headers:{
                    'Content-Type':'application/json'
                },

                body:JSON.stringify({
                    image:image
                })

            });

            const result = await response.json();

            ctx.clearRect(0,0,canvas.width,canvas.height);

            ctx.drawImage(video,0,0);

            result.forEach(face => {

                ctx.beginPath();

                ctx.lineWidth = 3;

                ctx.strokeStyle = '#00ff00';

                ctx.rect(face.x, face.y, face.w, face.h);

                ctx.stroke();

                ctx.fillStyle = '#00ff00';

                ctx.font = '20px Arial';

                ctx.fillText(
                    `${face.emotion} (${face.confidence}%)`,
                    face.x,
                    face.y - 10
                );

            });

        }

        catch(error){

            console.error(error);

        }

    }, 700);

});

</script>

</body>

</html>
